name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
      - run: pnpm check
      - run: |
          mkdir artifacts
          pnpm --dir packages/boring-table-core pack --pack-destination ../../artifacts
          pnpm --dir packages/react-boring-table pack --pack-destination ../../artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.tgz

  consumer-smoke:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node-version: 18
            react-version: 16.14.0
          - node-version: 18
            react-version: 17.0.2
          - node-version: 24
            react-version: 18.3.1
          - node-version: 24
            react-version: 19.2.3
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: |
          mkdir fixture
          cd fixture
          npm init --yes
          npm install ../artifacts/boring-table-*.tgz ../artifacts/react-boring-table-*.tgz react@${{ matrix.react-version }} react-dom@${{ matrix.react-version }}
          node --input-type=module --eval "import assert from 'node:assert/strict'; import { createBoringTable } from 'boring-table'; import { useTable } from 'react-boring-table'; const table = createBoringTable({ data: [{ id: 'one', value: 1 }], getId: (item) => item.id, columns: [{ body: (item) => item.value }] }); assert.equal(table.body[0].cells[0].value, 1); assert.equal(typeof useTable, 'function')"
          node --eval "const assert = require('node:assert/strict'); const React = require('react'); const { renderToStaticMarkup } = require('react-dom/server'); const { useTable } = require('react-boring-table'); function Consumer() { const table = useTable({ data: [{ id: 'one', value: 1 }], getId: (item) => item.id, columns: [{ body: (item) => item.value }] }); return React.createElement('span', null, table.body[0].cells[0].value) } assert.equal(renderToStaticMarkup(React.createElement(Consumer)), '<span>1</span>')"
